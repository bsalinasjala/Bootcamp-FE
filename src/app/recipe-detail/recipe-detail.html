<section class="recipe-card">
    <h2 class="recipe-title">
        {{ recipe().name }}

        @if (recipe().isFavorite) {
        <span class="favorite-icon">⭐</span>
        }
    </h2>

    <p class="recipe-description">{{ recipe().description }}</p>

    <img class="recipe-image" [src]="recipe().imgUrl" [alt]="recipe().name">

    <div class="servings-control">
        <h3>Servings: {{ servings() }}</h3>

        <div class="servings-buttons">
            <button (click)="decreaseServings()">-</button>
            <button (click)="increaseServings()">+</button>
        </div>
    </div>

    <div class="ingredients-section">
        <h3>Ingredients</h3>

        <ul>
            @for (ingredient of adjustedIngredients(); track ingredient.name) {
            <li>
                {{ ingredient.quantity }} {{ ingredient.unit }} - {{ ingredient.name }}
            </li>
            }
        </ul>
    </div>
</section>
