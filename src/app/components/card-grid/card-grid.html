<section class="cards-grid" aria-label="Catalogo de cartas">
  @for (card of cards(); track card.id) {
    <app-card-item
      [card]="card"
      [selected]="card.id === selectedCardId()"
      [inCollection]="collectionCardIds().includes(card.id)"
      (selectedCard)="cardSelected.emit($event)"
      (collectionToggled)="collectionToggled.emit($event)"
    />
  }
</section>
