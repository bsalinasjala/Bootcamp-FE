<a routerLink="/new-recipe">Add New Recipe</a>

<div class="search-section">
    <input type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" placeholder="Search recipe...">
</div>

<div class="recipe-buttons">
    @for (recipe of filteredRecipes(); track recipe.id) {
    <a [routerLink]="['/recipes', recipe.id]">
        {{ recipe.name }}
    </a>
    }
</div>
