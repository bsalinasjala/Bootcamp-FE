<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Components Card</title>
</head>
<body>

  <developer-card
    card-title="Hirotaka Nifuji"
    image="hirotaka-nifuji.jpg"
    role="Developer">
  </developer-card>

  <script>
    class DeveloperCard extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" });
      }

      connectedCallback() {
        console.log("Custom element added to page.");
        this.render();
      }

      disconnectedCallback() {
        console.log("Custom element removed from page.");
      }

      render() {
        const cardTitle = this.getAttribute("card-title");
        const image = this.getAttribute("image");
        const role = this.getAttribute("role");

        this.shadowRoot.innerHTML = `
          <style>
            .card {
              width: 350px;
              background-color: #242424;
              border: 4px solid black;
              font-family: Arial, sans-serif;
              text-align: center;
              overflow: hidden;
            }

            .logo {
              background-color: white;
              padding: 20px;
              font-size: 48px;
              font-weight: bold;
              color: #333333;
            }

            .logo span {
              color: #ef233c;
            }

            .content {
              padding: 35px 30px;
            }

            img {
              width: 230px;
              height: 230px;
              object-fit: cover;
              border-radius: 60px;
            }

            h2 {
              color: white;
              font-size: 34px;
              margin: 35px 0 0;
            }

            .role {
              background-color: #ef233c;
              color: white;
              font-size: 36px;
              font-weight: bold;
              padding: 18px;
            }
          </style>

          <div class="card">
            <div class="logo">
              Jala<span>Soft</span>
            </div>

            <div class="content">
              <img src="${image}" alt="${cardTitle}">
              <h2>${cardTitle}</h2>
            </div>

            <div class="role">
              ${role}
            </div>
          </div>
        `;
      }
    }

    customElements.define("developer-card", DeveloperCard);
  </script>

</body>
</html>
